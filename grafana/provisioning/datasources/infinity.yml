apiVersion: 1

datasources:
  - name: GitHub API
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: https://api.github.com
    jsonData:
      auth_method: bearerToken
    secureJsonData:
      bearerToken: ${GITHUB_TOKEN}

  - name: SonarCloud API
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: https://api.sonarcloud.io
    jsonData:
      auth_method: bearerToken
    secureJsonData:
      bearerToken: ${SONARCLOUD_TOKEN}

  - name: DefectDojo API
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: https://demo.defectdojo.org/api/v2
    jsonData:
      auth_method: apiKey
      apiKeyKey: Authorization
      apiKeyType: header
    secureJsonData:
      apiKeyValue: Token ${DEFECTDOJO_TOKEN}

  - name: Local JSON Server
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://json-server:3000
